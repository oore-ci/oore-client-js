name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Check out released source
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Bun
        if: steps.release.outputs.release_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Node and npm registry
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        if: steps.release.outputs.release_created == 'true'
        run: npm install --global npm@12.0.2

      - name: Install exact dependencies
        if: steps.release.outputs.release_created == 'true'
        run: bun ci

      - name: Check released package
        if: steps.release.outputs.release_created == 'true'
        run: bun run check

      - name: Match tag and package version
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: test "v$(node --print "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Publish public package
        if: steps.release.outputs.release_created == 'true'
        run: npm publish --access public
