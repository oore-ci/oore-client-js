name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing release tag (e.g. v0.9.0) when its npm publish failed
        required: false
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

# Two pushes to main in a row must not publish the same version twice.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Open or update release pull request
        id: release
        if: inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so
      # start CI on the release branch explicitly; its checks show on the PR.
      - name: Dispatch CI for release pull request
        # The runner evaluates this env even when the step is skipped, so
        # parse the PR JSON in the shell instead of with fromJSON.
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          release_branch=$(jq -r '.headBranchName' <<<"$RELEASE_PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"

      # A release whose npm publish failed (say, a registry outage) is already
      # tagged, so release-please won't report it again; publish it by tag.
      - name: Pick the release to publish
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${RELEASE_CREATED:-false}" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out released source
        if: steps.pick.outputs.publish == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.pick.outputs.tag }}

      - name: Set up Bun
        if: steps.pick.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Set up Node and npm registry
        if: steps.pick.outputs.publish == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        if: steps.pick.outputs.publish == 'true'
        run: npm install --global npm@12.0.2

      - name: Install exact dependencies
        if: steps.pick.outputs.publish == 'true'
        run: bun ci

      - name: Check released package
        if: steps.pick.outputs.publish == 'true'
        run: bun run check

      - name: Match tag and package version
        if: steps.pick.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.pick.outputs.tag }}
        run: test "v$(node --print "require('./package.json').version")" = "$RELEASE_TAG"

      # A retried release may already be on npm from an earlier attempt that
      # timed out after the registry accepted it.
      - name: Check whether this version is on npm
        id: npm
        if: steps.pick.outputs.publish == 'true'
        run: |
          version="$(node --print "require('./package.json').version")"
          if npm view "@oore/client@$version" version >/dev/null 2>&1; then
            echo "::notice::@oore/client@$version is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish public package
        if: steps.pick.outputs.publish == 'true' && steps.npm.outputs.published != 'true'
        timeout-minutes: 10
        run: npm publish --access public
