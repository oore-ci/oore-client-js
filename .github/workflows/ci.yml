name: CI

on:
  pull_request:
    # Drafts are skipped below, so marking a PR ready must start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Same-repo branches use the self-hosted runner; fork PRs stay on
    # GitHub-hosted images so untrusted code never reaches it.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'oore-linux' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          # The self-hosted runner keeps Bun's install cache on disk.
          no-cache: ${{ runner.environment == 'self-hosted' }}

      - name: Install exact dependencies
        run: bun ci

      - name: Check generated package
        run: bun run check

      # Untracked files count too: a new schema adds generated modules.
      - name: Require committed generation output
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
